[project]
name = "fact-check"
version = "2.0.0"
description = "Live fact-checking application for German TV shows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.128.0",
    "uvicorn[standard]>=0.40.0",
    "python-multipart>=0.0.20",
    "requests>=2.31.0",
    # AI Services
    "assemblyai>=1.5.5",
    "google-genai>=1.0.0",
    "tavily-python>=0.5.0",
    # PydanticAI + Logfire.
    # -slim with explicit extras instead of the full "pydantic-ai": that meta-package
    # pulls in the SDK of every supported provider (temporalio, botocore, mistralai,
    # anthropic, cohere, ...) — ~250 MB for code we never import. We only build
    # GoogleModel and OpenAIModel (see backend/services/llm_base.py).
    "pydantic-ai-slim[google,openai]>=1.0.0",
    "logfire>=3.0.0",
    # Database
    "aiosqlite>=0.20.0",
    # Utilities
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    # Unit tests build fake voiceprints as numpy arrays; sherpa-onnx is NOT needed
    # (the speaker-id embed path is lazy-imported and stubbed in tests).
    "numpy>=1.26.0",
]
# Speaker identification prod runtime (live fast lane, behind SPEAKER_ID_ENABLED).
# The Dockerfile installs this via `uv sync --no-dev --extra speakerid`; a plain
# `uv sync` leaves it out. The native libs (libonnxruntime) live in sherpa-onnx-core;
# sherpa-onnx declares it, but uv.lock records sherpa-onnx without dependencies, so it
# must be listed explicitly — else `import sherpa_onnx` fails on libonnxruntime.so.
# Keep both on the same version.
speakerid = [
    "sherpa-onnx>=1.13.8",
    "sherpa-onnx-core>=1.13.8",
    "numpy>=1.26.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests requiring real API keys",
]

[dependency-groups]
# Installed automatically by a plain `uv sync`, so a fresh clone can lint and run
# the unit tests without extra flags. Mirrors [project.optional-dependencies].test,
# which CI still installs explicitly via `--extra test --group test`.
dev = [
    "ruff>=0.14.14",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "nest-asyncio>=1.6.0",
    # Mirrors the `test` extra: speaker-id unit tests need numpy on a plain `uv sync`.
    "numpy>=1.26.0",
]
test = [
    "nest-asyncio>=1.6.0",
]
# Opt-in only (`uv sync --group bench`); never pulled by a plain sync or the Docker
# build, so the production image stays free of onnxruntime/audio deps. For the offline
# speaker-identification spike in benchmarks/speaker_id_bench.py.
bench = [
    "sherpa-onnx>=1.13.8",
    "sherpa-onnx-core>=1.13.8",  # native libs, see the speakerid extra
    "numpy>=1.26.0",
    "soundfile>=0.12.1",
]
