name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --extra test --group test

      - name: Lint
        run: uv run ruff check backend/

      - name: Test
        run: uv run pytest backend/tests -m "not integration" -q

  # Builds on every PR so a broken Dockerfile fails review, not main.
  # Pushes to GHCR only from main, tagged with the commit SHA for rollbacks.
  #
  # Note: no deploy job here. The Hostinger firewall blocks inbound SSH from GitHub
  # runners, so the backend is deployed from the laptop via deploy/deploy.sh. Phase 5
  # of docs/team-setup-plan.md turns that around: the VPS pulls the image built here.
  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
